<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>G1 Creative Agency — Dashboard</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://mgzzpejvspfkpsegnwqk.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <style>
    :root{--ink:#1c2b3a;--paper:#f7f5f0;--line:#d8d2c4;--gold:#c9a227;--gold-dark:#8a6d1a;--green:#3a7d44;--muted:#6b7280}
    html,body{height:100%;margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
    .topbar{background:var(--ink);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
    .container{max-width:820px;margin:18px auto;padding:12px}
    .card{background:white;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
    .filters{display:flex;gap:8px;margin-bottom:12px}
    .chip{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:white;cursor:pointer}
    .chip.active{background:var(--ink);color:white}
    .order-card{display:flex;flex-direction:column;gap:8px}
    .row{display:flex;justify-content:space-between;align-items:center}
    .status-badge{padding:6px 8px;border-radius:14px;font-weight:700}
    .status-new{background:#fdf1d6;color:#8a6d1a}
    .status-in_progress{background:#e2ecfa;color:#2b5fa8}
    .status-done{background:#e3f1e5;color:var(--green)}
    .links{display:flex;gap:8px}
    a.pill{padding:8px 10px;border-radius:10px;border:1px solid var(--line);text-decoration:none;color:var(--ink)}
    .login-container{display:flex;justify-content:center;align-items:center;height:70vh}
    .login-card{width:100%;max-width:360px}
    input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);margin-bottom:8px}
    button{padding:10px 12px;border-radius:8px;border:none;background:var(--gold-dark);color:white;font-weight:700}
  </style>
</head>
<body>
  <div class="topbar"><div>G1 Creative Agency</div><button id="logoutBtn" style="display:none">Logout</button></div>
  <div class="container">
    <div id="loginScreen" class="login-container">
      <div class="login-card card">
        <h2>Staff login</h2>
        <div id="loginError" style="color:var(--red);display:none"></div>
        <input id="email" type="text" placeholder="email" />
        <input id="password" type="password" placeholder="password" />
        <button id="loginBtn">Sign in</button>
      </div>
    </div>

    <div id="dashboardScreen" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center"><h3>Orders</h3><div><button id="refreshBtn">Refresh</button></div></div>
        <div class="filters">
          <div class="chip active" data-filter="all">All</div>
          <div class="chip" data-filter="new">New</div>
          <div class="chip" data-filter="in_progress">In progress</div>
          <div class="chip" data-filter="done">Done</div>
        </div>
        <div id="ordersList"></div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = document.body.dataset.supabaseUrl || 'https://mgzzpejvspfkpsegnwqk.supabase.co';
    const SUPABASE_ANON_KEY = document.body.dataset.supabaseAnonKey || 'eyJ...(legacy anon JWT, role=anon)';

    let session = JSON.parse(localStorage.getItem('g1_dashboard_session')||'null');
    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const loginError = document.getElementById('loginError');
    const ordersList = document.getElementById('ordersList');
    const chips = Array.from(document.querySelectorAll('.chip'));
    let lastOrders = [];
    let poller = null;
    let currentFilter = 'all';

    function showLogin(){ loginScreen.style.display='flex'; dashboardScreen.style.display='none'; logoutBtn.style.display='none'; }
    function showDashboard(){ loginScreen.style.display='none'; dashboardScreen.style.display='block'; logoutBtn.style.display='inline-block'; }

    if(session && session.access_token){ showDashboard(); startPolling(); } else { showLogin(); }

    loginBtn.addEventListener('click', async ()=>{ loginError.style.display='none'; const email = document.getElementById('email').value; const password = document.getElementById('password').value; try{ const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},body:JSON.stringify({email,password})}); const data = await res.json(); if(data.access_token){ session = data; localStorage.setItem('g1_dashboard_session', JSON.stringify(session)); showDashboard(); startPolling(); } else { loginError.textContent = 'Login failed'; loginError.style.display='block'; } } catch(e){ loginError.textContent='Network error'; loginError.style.display='block'; }});

    logoutBtn.addEventListener('click', ()=>{ localStorage.removeItem('g1_dashboard_session'); session = null; stopPolling(); showLogin(); });

    function startPolling(){ fetchOrders(); poller = setInterval(fetchOrders,15000); }
    function stopPolling(){ if(poller) clearInterval(poller); }

    async function fetchOrders(){ try{ const token = session && session.access_token; const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc`,{headers:{'apikey':SUPABASE_ANON_KEY,'Authorization': token?`Bearer ${token}`:''}}); if(res.status===401){ // session expired
          localStorage.removeItem('g1_dashboard_session'); session=null; stopPolling(); showLogin(); return; }
        const orders = await res.json(); lastOrders = orders; renderOrders(); } catch(e){ console.warn('Fetch orders failed',e); } }

    function renderOrders(){ ordersList.innerHTML=''; const filtered = lastOrders.filter(o=> currentFilter==='all' || o.status===currentFilter); for(const o of filtered){ const el = document.createElement('div'); el.className='card order-card'; el.innerHTML = `<div class="row"><div><strong>${escapeHtml(o.order_code)}</strong><div class="status">${new Date(o.created_at).toLocaleString()}</div></div><div><span class="status-badge status-${escapeHtml(o.status)}">${escapeHtml(o.status)}</span></div></div>`;
        const details = document.createElement('div'); details.innerHTML = `<div>Job: ${escapeHtml(o.job)}</div><div>Copies: ${escapeHtml(String(o.copies))}</div>`;
        if(!o.bring_own){ details.innerHTML += `<div>Color: ${escapeHtml(o.color||'')}</div><div>Paper: ${escapeHtml(o.paper_size||'')}</div><div>Finishing: ${escapeHtml(o.finishing||'')}</div>`; }
        details.innerHTML += `<div>Customer: ${escapeHtml(o.customer_name)}</div>`;
        el.appendChild(details);
        const linkRow = document.createElement('div'); linkRow.className='links'; if(o.ticket_link) linkRow.innerHTML += `<a class="pill" href="${o.ticket_link}" target="_blank">View Ticket</a>`; if(o.file_link) linkRow.innerHTML += `<a class="pill" href="${o.file_link}" target="_blank">Download File</a>`; el.appendChild(linkRow);
        const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.justifyContent='flex-end'; btnRow.style.marginTop='8px'; const actionBtn = document.createElement('button'); if(o.status==='new'){ actionBtn.textContent='Start Order'; actionBtn.onclick = ()=>updateStatus(o.id,'in_progress'); } else if(o.status==='in_progress'){ actionBtn.textContent='Mark Done'; actionBtn.onclick = ()=>updateStatus(o.id,'done'); } else { actionBtn.textContent='Reopen'; actionBtn.onclick = ()=>updateStatus(o.id,'new'); }
        btnRow.appendChild(actionBtn); el.appendChild(btnRow);
        ordersList.appendChild(el); }
    }

    async function updateStatus(id, status){ try{ const token = session && session.access_token; const res = await fetch(`${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`,{method:'PATCH',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization': token?`Bearer ${token}`:'','Prefer':'return=minimal'},body:JSON.stringify({status})}); if(res.status===401){ localStorage.removeItem('g1_dashboard_session'); session=null; stopPolling(); showLogin(); return; } await fetchOrders(); } catch(e){ console.warn('Update failed',e); } }

    document.getElementById('refreshBtn').addEventListener('click', fetchOrders);

    chips.forEach(c=>c.addEventListener('click', ()=>{ chips.forEach(x=>x.classList.remove('active')); c.classList.add('active'); currentFilter=c.dataset.filter; renderOrders(); }));

    function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m]; }); }
  </script>
</body>
</html>
