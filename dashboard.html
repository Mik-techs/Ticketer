<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G1 Creative Agency - Order Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ink:#1c2b3a;--paper:#f7f5f0;--gold:#c9a227;--green:#3a7d44;--red:#b0413e;--line:#d8d2c4;--muted:#686f7d}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card,.order,.upload{background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.login .card{width:min(360px,100%)}h1{font-size:20px;margin:0 0 18px}.sub{color:var(--muted);font-size:13px}.label{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:var(--muted)}input,select{width:100%;padding:10px;border:1px solid #8e8a81;border-radius:7px;background:#fff}.password-wrap{display:flex;gap:8px;align-items:center}.password-wrap input{flex:1}.password-toggle{padding:10px 12px;background:#fff;border:1px solid #8e8a81;color:var(--ink);white-space:nowrap}.login button.primary{width:100%;margin-top:16px}button{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--ink);color:#fff}.error{color:var(--red);font-size:13px}.top{background:var(--ink);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:16px}.wrap{max-width:820px;margin:auto;padding:16px 20px 60px}.tabs{display:flex;gap:8px;padding:14px 20px 0;max-width:820px;margin:auto}.tabs button{background:transparent;color:var(--muted);border-bottom:2px solid transparent;border-radius:0}.tabs button.active{color:var(--ink);border-color:var(--ink)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filters button{background:#fff;border:1px solid #8e8a81;color:var(--muted)}.filters button.active{background:var(--ink);color:#fff}.order{margin-bottom:12px}.order-head{display:flex;justify-content:space-between;gap:10px}.order h2{font-size:16px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted)}.details{font-size:13px;line-height:1.8;margin:12px 0}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{color:#8a6d1a;font-size:13px;font-weight:700}.actions{margin-top:12px}.upload{margin-bottom:20px}.progress{height:7px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.item img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.item div{padding:8px;font-size:12px;font-weight:700}.item button{width:100%;margin-top:6px;color:var(--red);background:#fff;border:1px solid var(--line)}.empty{text-align:center;color:var(--muted);padding:50px 10px}
</style>
</head>
<body data-supabase-url="https://mgzzpejvspfkpsegnwqk.supabase.co" data-supabase-anon-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1nenpwZWp2c3Bma3BzZWdud3FrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NTE1MDAsImV4cCI6MjEwMjIyNzUwMH0.Ls27DGDlGjTGx5tKuExLO1lSHY3mMcK6i4-VSjVzpQk">
<section id="login" class="login"><div class="card"><h1>G1 Creative Agency</h1><p class="sub">Staff dashboard - please log in.</p><p id="loginError" class="error" hidden>Wrong email or password.</p><label class="label" for="email">Email</label><input id="email" type="email" autocomplete="username"><label class="label" for="password">Password</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password"><button type="button" id="togglePassword" class="password-toggle" aria-pressed="false">Show</button></div><button id="loginBtn" class="primary">Log in</button></div></section>
<section id="app" hidden><header class="top"><h1 id="title">Order Dashboard</h1><button id="logout">Log out</button></header><nav class="tabs"><button class="active" data-tab="orders">Orders</button><button data-tab="portfolio">Portfolio</button></nav><main class="wrap"><section id="ordersPanel"><div class="filters"><button class="active" data-filter="all">All</button><button data-filter="new">New</button><button data-filter="in_progress">In progress</button><button data-filter="done">Done</button></div><div id="orders"></div></section><section id="portfolioPanel" hidden><div class="upload"><h2>Add a sample to the public portfolio</h2><label class="label" for="pfTitle">Title</label><input id="pfTitle" placeholder="e.g. Wedding invitation cards"><label class="label" for="pfCategory">Category</label><select id="pfCategory"><option value="standardPrint">Print &amp; Copy</option><option value="card">Cards</option><option value="banner">Banners</option><option value="stickers">Stickers</option><option value="apparel">T-Shirts</option><option value="other">Other</option></select><label class="label" for="pfFile">Photo</label><input id="pfFile" type="file" accept="image/*"><div class="progress" id="progress" hidden><i></i></div><p id="pfError" class="error" hidden></p><button id="pfSubmit" class="primary">Add to Portfolio</button></div><p class="meta">Current portfolio (<span id="count">0</span> items)</p><div id="portfolio" class="grid"></div></section></main></section>
<script>
(function(){
const body=document.body,SB=body.dataset.supabaseUrl,KEY=body.dataset.supabaseAnonKey,SK='g1_dashboard_session';let session=null,orders=[],filter='all';
const $=id=>document.getElementById(id),auth=()=>({'apikey':KEY,'Authorization':`Bearer ${session.access_token}`}),safe=u=>typeof u==='string'&&/^https?:\/\//i.test(u),esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
function save(){localStorage.setItem(SK,JSON.stringify(session))}function clear(){localStorage.removeItem(SK)}
$('togglePassword').onclick=()=>{const input=$('password'),visible=input.type==='text';input.type=visible?'password':'text';$('togglePassword').textContent=visible?'Show':'Hide';$('togglePassword').setAttribute('aria-pressed',String(!visible))};
async function login(){const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});if(!r.ok){let detail='Login failed. Check the email and password.';try{const j=await r.json();if(j.error_description)detail=j.error_description}catch(e){}throw Error(detail)}session=await r.json();save();show()}
$('loginBtn').onclick=async()=>{const b=$('loginBtn');b.disabled=true;$('loginError').hidden=true;try{await login()}catch(e){$('loginError').textContent=e.message;$('loginError').hidden=false}finally{b.disabled=false}};
$('logout').onclick=()=>{clear();location.reload()};
async function api(path,opt={}){const r=await fetch(`${SB}/rest/v1/${path}`,{...opt,headers:{...auth(),...(opt.headers||{})}});if(r.status===401){clear();location.reload()}if(!r.ok)throw Error(await r.text());return r}
async function loadOrders(){try{orders=await (await api('orders?select=*&order=created_at.desc')).json();renderOrders()}catch(e){$('orders').innerHTML='<p class="error">Could not load orders.</p>'}}
function renderOrders(){const list=filter==='all'?orders:orders.filter(o=>o.status===filter);if(!list.length){$('orders').innerHTML='<p class="empty">No orders yet.</p>';return}$('orders').innerHTML=list.map(o=>{const links=[];if(safe(o.ticket_link))links.push(`<a href="${esc(o.ticket_link)}" target="_blank" rel="noopener">View ticket</a>`);if(safe(o.file_link))links.push(`<a href="${esc(o.file_link)}" target="_blank" rel="noopener">Download file</a>`);const next=o.status==='new'?'in_progress':o.status==='in_progress'?'done':'new';return `<article class="order"><div class="order-head"><div><h2>${esc(o.job)}</h2><div class="meta">#${esc(o.order_code)} · ${new Date(o.created_at).toLocaleString()}</div></div><b>${esc(o.status.replace('_',' '))}</b></div><div class="details"><b>Copies:</b> ${o.copies}<br><b>Customer:</b> ${esc(o.customer_name)}${o.file_name?`<br><b>File:</b> ${esc(o.file_name)}`:''}</div>${links.length?`<div class="links">${links.join('')}</div>`:''}<div class="actions"><button class="primary" data-id="${o.id}" data-status="${next}">${next==='new'?'Reopen':next==='done'?'Mark done':'Start order'}</button></div></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await api(`orders?id=eq.${encodeURIComponent(b.dataset.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({status:b.dataset.status})});loadOrders()})}
async function uploadImage(file){if(!session?.access_token)throw Error('Not logged in');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${crypto.randomUUID()}.${ext}`;const r=await fetch(`${SB}/storage/v1/object/portfolio/${encodeURIComponent(path)}`,{method:'POST',headers:{...auth(),'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok)throw Error(await r.text());return `${SB}/storage/v1/object/public/portfolio/${encodeURIComponent(path)}`}
async function loadPortfolio(){try{const items=await (await api('portfolio_items?select=*&order=display_order.asc,created_at.desc')).json();const valid=items.filter(i=>safe(i.image_url));$('count').textContent=valid.length;$('portfolio').innerHTML=valid.length?valid.map(i=>`<article class="item"><img src="${esc(i.image_url)}" alt="${esc(i.title)}"><div>${esc(i.title||'(untitled)')}<button data-delete="${i.id}">Delete</button></div></article>`).join(''):'<p class="empty">No portfolio items yet.</p>';document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{await api(`portfolio_items?id=eq.${encodeURIComponent(b.dataset.delete)}`,{method:'DELETE',headers:{'Prefer':'return=minimal'}});loadPortfolio()})}catch(e){$('portfolio').innerHTML='<p class="error">Could not load portfolio items.</p>'}}
$('pfSubmit').onclick=async()=>{const file=$('pfFile').files[0],err=$('pfError'),btn=$('pfSubmit'),bar=document.querySelector('#progress i'),prog=$('progress');err.hidden=true;if(!file){err.textContent='Choose an image first.';err.hidden=false;return}btn.disabled=true;btn.textContent='Uploading…';prog.hidden=false;bar.style.width='25%';try{const image_url=await uploadImage(file);bar.style.width='70%';await api('portfolio_items',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({title:$('pfTitle').value.trim(),category:$('pfCategory').value,image_url})});bar.style.width='100%';$('pfTitle').value='';$('pfFile').value='';await loadPortfolio()}catch(e){err.textContent='Upload failed: '+e.message;err.hidden=false}finally{btn.disabled=false;btn.textContent='Add to Portfolio';setTimeout(()=>prog.hidden=true,500)}};
function show(){$('login').hidden=true;$('app').hidden=false;loadOrders()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=b.dataset.tab==='portfolio';$('ordersPanel').hidden=p;$('portfolioPanel').hidden=!p;$('title').textContent=p?'Portfolio':'Order Dashboard';if(p)loadPortfolio()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderOrders()});try{const s=JSON.parse(localStorage.getItem(SK));if(s?.access_token){session=s;show()}}catch(e){}
})();
</script></body></html>
