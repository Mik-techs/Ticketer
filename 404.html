<style>
 :root{
 --ink:#1c2b3a;
 --paper:#f7f5f0;
 --amber:#c9a227;
 --gold-dark:#8a6d1a;
 --muted:#686f7d;
 --line:#d8d2c4;
 }
 *{box-sizing:border-box;}
 body{
 margin:0;
 min-height:100vh;
 background:var(--paper);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 color:var(--ink);

 align-items:center;

 }
 .card{
 max-width:380px;
 width:100%;
 text-align:center;
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:36px 28px;
 position:relative;
 overflow:hidden;
 }
 .card::before{
 content:"";
 position:absolute;
 top:0;left:0;right:0;
 height:6px;
 background:repeating-linear-gradient(90deg, var(--amber) 0 10px, transparent 10px 20px);
 opacity:.6;
 }
 .icon{width:52px;height:52px;color:var(--gold-dark);margin:0 auto 18px;}
 .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dark);font-weight:700;margin:0 0 8px;}
 h1{font-size:21px;margin:0 0 10px;}
 p.sub{font-size:14px;color:var(--muted);line-height:1.6;margin:0 0 26px;}
 .links{display:flex;flex-direction:column;gap:10px;}
 .links a{
 display:block;
 padding:13px;
 border-radius:9px;
 font-weight:700;
 font-size:14.5px;
 text-decoration:none;
 }
 .links a.primary{background:var(--amber);color:#fff;}
 .links a.secondary{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
</style>
