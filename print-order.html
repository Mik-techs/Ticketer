<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Print Shop — Place an Order</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#f3f4f6;color:#111;padding:18px}
    .wrap{max-width:720px;margin:0 auto;background:#fff;padding:18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    label{display:block;margin-top:10px;font-weight:600}
    input[type=text],select,textarea{width:100%;padding:8px;margin-top:6px;border-radius:6px;border:1px solid #e5e7eb}
    .row{display:flex;gap:8px}
    .row > *{flex:1}
    button{margin-top:12px;padding:10px 14px;border-radius:8px;border:0;background:#0066ff;color:#fff;cursor:pointer}
    .small{font-size:13px;color:#6b7280}
  </style>
</head>
<body>
  <div class="wrap" data-shop-whatsapp="233546850197" data-upload-endpoint="https://catbox.moe/user/api.php" data-jsonstorage-url="" id="app">
    <h2>Place a print order</h2>
    <form id="orderForm">
      <label>What to print (e.g., "Flyer A5")<input name="item" required /></label>
      <label>Copies<input name="copies" type="number" min="1" value="1" required /></label>
      <label>File (optional)<input name="file" type="file" accept="image/*,application/pdf" /></label>
      <label>Color</label>
      <select name="color"><option>Color</option><option>Black & White</option></select>
      <label>Paper</label>
      <select name="paper"><option>Standard</option><option>Premium</option></select>
      <label>Finishing (optional)</label>
      <input name="finishing" />
      <label>Your name<input name="name" required /></label>
      <div class="small">By sending, you confirm the file is yours to print and not illegal content.</div>
      <button type="submit">Send order via WhatsApp</button>
    </form>
    <div id="status" class="small" style="margin-top:10px"></div>
  </div>

  <script>
    const app = document.getElementById('app');
    const shopWhats = app.dataset.shopWhatsapp;
    const uploadEndpoint = app.dataset.uploadEndpoint;

    const form = document.getElementById('orderForm');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = '';

      const fd = new FormData(form);
      const file = fd.get('file');

      let fileUrl = null;
      let uploadFailed = false;

      if (file && file.size > 0) {
        // simple client-side size/type check
        if (file.size > 10 * 1024 * 1024) { // 10MB limit
          alert('File too large (max 10 MB)');
          return;
        }

        status.textContent = 'Uploading file...';
        try {
          const up = new FormData();
          up.append('reqtype', 'fileupload');
          up.append('fileToUpload', file);

          const r = await fetch(uploadEndpoint, { method: 'POST', body: up });
          const text = await r.text();
          // Catbox returns a direct link in the response body
          if (r.ok && text && text.startsWith('http')) {
            fileUrl = text.trim();
          } else {
            console.warn('upload response', r.status, text);
            uploadFailed = true;
          }
        } catch (err) {
          console.error(err);
          uploadFailed = true;
        }
      }

      // build order object
      const order = {
        item: fd.get('item'),
        copies: Number(fd.get('copies')) || 1,
        color: fd.get('color'),
        paper: fd.get('paper'),
        finishing: fd.get('finishing') || '',
        name: fd.get('name'),
        fileUrl: fileUrl,
        uploaded: !!fileUrl,
        uploadFailed: uploadFailed
      };

      status.textContent = 'Saving order...';

      try {
        const res = await fetch('/api/create-order', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ order })
        });
        const j = await res.json();
        if (!res.ok) throw new Error(j && j.error ? j.error : 'Failed to create order');

        const id = j.id;
        const ticketUrl = `${location.origin}${location.pathname.replace(/[^/]*$/, '')}view.html?id=${encodeURIComponent(id)}`;

        // build WhatsApp link — brief message with the ticket link
        const waText = `Hi, I've placed an order. Ticket: ${ticketUrl}`;
        const waLink = `https://wa.me/${shopWhats}?text=${encodeURIComponent(waText)}`;

        status.textContent = 'Opening WhatsApp — tap Send to complete.';
        // open WhatsApp in a new tab/window
        window.open(waLink, '_blank');
      } catch (err) {
        console.error(err);
        status.textContent = 'Error saving order: ' + err.message;
        alert('Could not save the order. You can still send WhatsApp manually: copy the details.');
      }
    });
  </script>
</body>
</html>
